<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validar cupom — Matheus Motos</title>
<style>
body{margin:0;background:#0b0b0d;color:#f5f5f5;font-family:system-ui,sans-serif;padding:24px;max-width:520px;margin:0 auto}
h1{font-size:22px}
input,button{width:100%;padding:14px;border-radius:10px;border:1px solid #333;font-size:18px;margin-bottom:10px;box-sizing:border-box;font-family:inherit}
input{background:#1a1a1d;color:#fff;text-transform:uppercase}
button{background:#e10f14;color:#fff;border:0;font-weight:700;cursor:pointer}
button.b{background:#1e7d3c}
button.x{background:transparent;border:2px solid #e10f14;color:#ff6b6b}
#r{font-size:19px;margin:14px 0;min-height:30px;line-height:1.35}
#pv{display:none;margin-top:6px}
#pv img{width:100%;max-height:75vh;object-fit:contain;border-radius:12px;border:1px solid #333;background:#fff;cursor:zoom-in}
#pv small{color:#b9b9c0;display:block;margin-top:6px}
</style></head><body>
<h1>🏍️ Validar cupom</h1>
<input id="pin" type="password" placeholder="PIN do atendente" style="text-transform:none">
<input id="code" placeholder="Código do cupom (MM-XXXX)">
<button onclick="go('consultar')">Consultar</button>
<button class="b" onclick="go('usar')">✅ Dar baixa (aplicar desconto)</button>
<button class="x" onclick="go('excluir')">🗑️ Não valeu — recusar e excluir</button>
<div id="r"></div>
<div id="pv"><img id="im" alt="Print enviado pelo cliente"><small>Print enviado pelo cliente (toque para abrir em tela cheia)</small></div>
<script>
var im=document.getElementById("im"),pv=document.getElementById("pv");
im.onclick=function(){var w=window.open();w.document.write('<body style="margin:0;background:#000"><img src="'+im.src+'" style="width:100%">')};
async function go(acao){
  if(acao==="excluir"&&!confirm("Excluir este cupom? O cliente não poderá mais usar."))return;
  var r=document.getElementById("r");r.textContent="…";
  try{
    var res=await fetch("/api/cupom",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({pin:document.getElementById("pin").value,code:document.getElementById("code").value,acao:acao})});
    var d=await res.json();r.textContent=d.msg||"";
    if(d.img){im.src="data:image/jpeg;base64,"+d.img;pv.style.display="block"}
    else if(acao!=="usar"){pv.style.display="none"}
  }catch(e){r.textContent="Erro de conexão"}
}
</script></body></html>
